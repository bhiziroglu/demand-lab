[project]
name = "demand-lab"
version = "0.1.0"
description = "Weekly SKU-store demand forecasts on Walmart M5, with promo drivers and what-if charts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasetsforecast>=0.0.8",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.0",
    "mlforecast>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.2",
    "statsforecast>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
demand-lab = "demand_lab.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_lab"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
